cluster:
  host: cluster1.demo.netapp.com
  username: admin
  password: Netapp1!

svm: 
  name: prueba
  ipspace: Default  
  aggregate: cluster1_01_SSD_1
  language: c.utf_8
  security_style: unix

  # Se crea automáticamente. Parece que no es necesario especificarlo
  # root_volume: svm_1_cluster_root

  # Parámetros de modificación
  aggr_list:
    - cluster1_01_SSD_1
    - cluster1_02_SSD_1
  is_space_reporting_logical: true
  is_space_enforcement_logical: true
  
  # Parámetros FCP
  fcp_status_admin: true  # true = up, false = down
  
  # Configuración de protocolos (true = allowed, false = not allowed)
  protocols:
    cifs: false
    nfs: false
    ndmp: false
    s3: false
    fcp: true
    iscsi: true

# Configuración de Network Interfaces
# Se pueden añadir tantas interfaces como se necesiten
net_interfaces:
  - lif: prueba_N1
    home_node: cluster1-01
    home_port: 0a
    data_protocol: fcp
    status_admin: true  
  
  - lif: prueba_N2
    home_node: cluster1-02
    home_port: 0b
    data_protocol: fcp
    status_admin: true



